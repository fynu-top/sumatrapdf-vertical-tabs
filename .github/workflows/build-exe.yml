      - name: Compile both Windows x64 release executables
        shell: pwsh
        working-directory: sumatrapdf
        run: |
          bun .\cmd\build.ts -all
          if ($LASTEXITCODE -ne 0) { throw 'C++ compilation failed; inspect errors above' }
      - name: Check generated binaries
        shell: pwsh
        run: |
          $out = 'sumatrapdf\out\rel64'
          foreach ($exe in @('SumatraPDF.exe','SumatraPDF-static.exe')) {
            $path = Join-Path $out $exe
            if (-not (Test-Path $path)) { throw "Expected executable not found: $path" }
            $stream = [System.IO.File]::OpenRead((Resolve-Path $path))
            try {
              if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Invalid PE header in $exe" }
            } finally { $stream.Dispose() }
            Get-Item $path | Select-Object FullName,Length
          }
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-VerticalTabs-Windows-x64
          path: |
            sumatrapdf/out/rel64/SumatraPDF.exe
            sumatrapdf/out/rel64/SumatraPDF-static.exe
          if-no-files-found: error
          retention-days: 30
