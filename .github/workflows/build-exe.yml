name: Build SumatraPDF Vertical Tabs EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-exe.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 portable executables
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Install Bun on GitHub Windows runner
        uses: oven-sh/setup-bun@v2
      - name: Download pinned upstream SumatraPDF source
        shell: pwsh
        run: |
          git init sumatrapdf
          git -C sumatrapdf remote add origin https://github.com/sumatrapdfreader/sumatrapdf.git
          git -C sumatrapdf fetch --depth 1 origin c71a7144015727f734af2773292b4e07f1f617be
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch upstream source' }
          git -C sumatrapdf checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check out upstream source' }
