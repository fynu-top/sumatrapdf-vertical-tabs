name: Build SumatraPDF Vertical Tabs EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout workflow repository (including the original patch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Download upstream SumatraPDF source
        shell: pwsh
        run: |
          git init sumatrapdf
          git -C sumatrapdf remote add origin https://github.com/sumatrapdfreader/sumatrapdf.git
          git -C sumatrapdf fetch --depth 1 origin c71a7144015727f734af2773292b4e07f1f617be
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch SumatraPDF source' }
          git -C sumatrapdf checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to check out SumatraPDF source' }

      - name: Apply native tabs patch and fix missing C++ declaration
        shell: pwsh
        run: |
          $original = (git show '365ce53e47f80ed54eca40baf1c0757c19583a67:.github/workflows/build-exe.yml') -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Original embedded patch was not found in Git history' }
          $match = [regex]::Match($original, '(?s)\$b64\s*=\s*@''\r?\n(.*?)\r?\n\s*''@')
          if (-not $match.Success) { throw 'Embedded Python patch not found in original workflow' }
          $bytes = [Convert]::FromBase64String(($match.Groups[1].Value -replace '\s', ''))
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'apply_patch.py'), $bytes)
          python .\apply_patch.py .\sumatrapdf
          if ($LASTEXITCODE -ne 0) { throw 'C++ patch application failed' }

          $cpp = (Resolve-Path '.\sumatrapdf\src\SumatraPDF.cpp').Path
          $source = [System.IO.File]::ReadAllText($cpp)
          $marker = 'constexpr UINT kVerticalTabsListId = 0x7D01;'
          if ([regex]::Matches($source, [regex]::Escape($marker)).Count -ne 1) {
            throw 'Vertical-tab declaration insertion point not found exactly once'
          }
          $source = $source.Replace($marker, "void SyncVerticalTabs(MainWindow*);`n$marker")
          [System.IO.File]::WriteAllText($cpp, $source, [System.Text.UTF8Encoding]::new($false))
          if (-not $source.Contains('static void CreateVerticalTabs')) { throw 'Vertical tab UI was not generated' }
          Write-Host 'Vertical tabs C++ patch and forward declaration verified.'

      - name: Build Windows x64 portable executables
        shell: pwsh
        working-directory: sumatrapdf
        run: |
          bun .\cmd\build.ts -all
          if ($LASTEXITCODE -ne 0) { throw 'C++ build failed; check first compiler error above' }

      - name: Verify executables
        shell: pwsh
        run: |
          foreach ($file in @('SumatraPDF.exe', 'SumatraPDF-static.exe')) {
            $path = Join-Path 'sumatrapdf\out\rel64' $file
            if (-not (Test-Path $path)) { throw "Missing output: $path" }
            $stream = [System.IO.File]::OpenRead((Resolve-Path $path).Path)
            try {
              if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Not a Windows executable: $path" }
            } finally { $stream.Dispose() }
            Get-Item $path | Select-Object FullName, Length
          }

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-VerticalTabs-Windows-x64
          path: |
            sumatrapdf/out/rel64/SumatraPDF.exe
            sumatrapdf/out/rel64/SumatraPDF-static.exe
          if-no-files-found: error
          retention-days: 30
